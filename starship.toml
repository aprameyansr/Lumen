# No newline at start
add_newline = false

format = """
$cmd_duration 󰜥 $directory $python $git_branch
$character"""

# --------------------------
# CHARACTER (PROMPT SYMBOL)
# --------------------------
[character]
success_symbol = "[   ](bold fg:#7b7dea)"
error_symbol   = "[   ](bold fg:#4445b2)"

# --------------------------
# GIT BRANCH
# --------------------------
[git_branch]
symbol = "󰘬"
style = "bg:#4445b2 fg:#f7f7f8"
truncation_length = 12
format = "󰜥 [](bold fg:#4445b2)[$symbol $branch]($style)[ ](bold fg:#4445b2)"

# --------------------------
# DIRECTORY
# --------------------------
[directory]
home_symbol = "  "
read_only = "  "
style = "bg:#1c1c49 fg:#f7f7f8"
format = '[](bold fg:#1c1c49)[󰉋 $path]($style)[](bold fg:#1c1c49)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

# --------------------------
# CMD DURATION
# --------------------------
[cmd_duration]
min_time = 0
style = "bg:#7b7dea fg:#f7f7f8"
format = '[](bold fg:#7b7dea)[󰪢 $duration]($style)[](bold fg:#7b7dea)'

# --------------------------
# HOSTNAME
# --------------------------
[hostname]
style = "bg:#323384 fg:#f7f7f8"
format = "[](bold fg:#323384)[•$hostname]($style)[](bold fg:#323384)"
ssh_only = false
disabled = false

# --------------------------
# USERNAME
# --------------------------
[username]
style_user = "bold bg:#18183f fg:#f7f7f8"
format = "[](bold fg:#18183f)[$user]($style)[](bold fg:#18183f)"
show_always = true

# --------------------------
# PACKAGE
# --------------------------
[package]
disabled = true

# --------------------------
# PYTHON VENV
# --------------------------
[python]
disabled = false
detect_extensions = []
detect_files = []
detect_folders = []
symbol = ""
style = "bg:#11139c fg:#e4e4e7"
format = '[](bold fg:#11139c)[$symbol ($virtualenv)]($style)[](bold fg:#11139c)'
