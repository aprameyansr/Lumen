source = $HOME/.cache/lumen/hyprlock-colors.conf

# BACKGROUND
background {
    monitor =
    path = ~/.local/state/lumen/hyprlock-wallpaper
}

general {
    hide_cursor = true
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %d %b")"
  color = $hyprlock_text
  font_size = 60
  font_family = Adwaita Sans, thin
  position = 0, 375
  halign = center
  valign = center
}

# TIME
label {
  monitor =
  text = cmd[update:1000] echo -e "$(date +"%H")"
  color = $hyprlock_secondary
  font_size = 120
  font_family = Adwaita Sans, Heavy
  position = -15, 180
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo -e "$(date +"%M")"
  color = $hyprlock_text
  font_size = 120
  font_family = Adwaita Sans, Heavy
  position = 15, 45
  halign = center
  valign = center
}

# PSWD PROMPT
input-field {
    monitor =
    size = 310, 80
    outline_thickness = 2
    outer_color = $hyprlock_field_border
    inner_color = $hyprlock_field_bg
    font_color = $hyprlock_text
    fade_on_empty = false
    rounding = 20
    dots_size = 0.15
    dots_spacing = 0.35
    dots_center = true
    check_color = $hyprlock_accent
    placeholder_text = Enter Password
    hide_input = false
    font_family = Adwaita Sans, Italic
    position = 0, -420
    halign = center
    valign = center
    zindex = 1
}
auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250 # in milliseconds
     }
 }
