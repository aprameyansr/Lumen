# No newline at start
add_newline = false

format = """
$cmd_duration 󰜥 $directory $python $git_branch
$character"""

# --------------------------
# CHARACTER (PROMPT SYMBOL)
# --------------------------
[character]
success_symbol = "[   ](bold fg:#7c95b0)"
error_symbol   = "[   ](bold fg:#5f6770)"

# --------------------------
# GIT BRANCH
# --------------------------
[git_branch]
symbol = "󰘬"
style = "bg:#5f6770 fg:#eff6fe"
truncation_length = 12
format = "󰜥 [](bold fg:#5f6770)[$symbol $branch]($style)[ ](bold fg:#5f6770)"

# --------------------------
# DIRECTORY
# --------------------------
[directory]
home_symbol = "  "
read_only = "  "
style = "bg:#1d242b fg:#eff6fe"
format = '[](bold fg:#1d242b)[󰉋 $path]($style)[](bold fg:#1d242b)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

# --------------------------
# CMD DURATION
# --------------------------
[cmd_duration]
min_time = 0
style = "bg:#7c95b0 fg:#eff6fe"
format = '[](bold fg:#7c95b0)[󰪢 $duration]($style)[](bold fg:#7c95b0)'

# --------------------------
# HOSTNAME
# --------------------------
[hostname]
style = "bg:#303943 fg:#eff6fe"
format = "[](bold fg:#303943)[•$hostname]($style)[](bold fg:#303943)"
ssh_only = false
disabled = false

# --------------------------
# USERNAME
# --------------------------
[username]
style_user = "bold bg:#192027 fg:#eff6fe"
format = "[](bold fg:#192027)[$user]($style)[](bold fg:#192027)"
show_always = true

# --------------------------
# PACKAGE
# --------------------------
[package]
disabled = true

# --------------------------
# PYTHON VENV
# --------------------------
[python]
disabled = false
detect_extensions = []
detect_files = []
detect_folders = []
symbol = ""
style = "bg:#38495d fg:#d8dfe7"
format = '[](bold fg:#38495d)[$symbol ($virtualenv)]($style)[](bold fg:#38495d)'
