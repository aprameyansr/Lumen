# No newline at start
add_newline = false

format = """
$cmd_duration 󰜥 $directory $python $git_branch
$character"""

# --------------------------
# CHARACTER (PROMPT SYMBOL)
# --------------------------
[character]
success_symbol = "[   ](bold fg:#d6a76f)"
error_symbol   = "[   ](bold fg:#5f6d85)"

# --------------------------
# GIT BRANCH
# --------------------------
[git_branch]
symbol = "󰘬"
style = "bg:#5f6d85 fg:#f0f5ff"
truncation_length = 12
format = "󰜥 [](bold fg:#5f6d85)[$symbol $branch]($style)[ ](bold fg:#5f6d85)"

# --------------------------
# DIRECTORY
# --------------------------
[directory]
home_symbol = "  "
read_only = "  "
style = "bg:#1d283c fg:#f0f5ff"
format = '[](bold fg:#1d283c)[󰉋 $path]($style)[](bold fg:#1d283c)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

# --------------------------
# CMD DURATION
# --------------------------
[cmd_duration]
min_time = 0
style = "bg:#d6a76f fg:#f0f5ff"
format = '[](bold fg:#d6a76f)[󰪢 $duration]($style)[](bold fg:#d6a76f)'

# --------------------------
# HOSTNAME
# --------------------------
[hostname]
style = "bg:#2f3e59 fg:#f0f5ff"
format = "[](bold fg:#2f3e59)[•$hostname]($style)[](bold fg:#2f3e59)"
ssh_only = false
disabled = false

# --------------------------
# USERNAME
# --------------------------
[username]
style_user = "bold bg:#192438 fg:#f0f5ff"
format = "[](bold fg:#192438)[$user]($style)[](bold fg:#192438)"
show_always = true

# --------------------------
# PACKAGE
# --------------------------
[package]
disabled = true

# --------------------------
# PYTHON VENV
# --------------------------
[python]
disabled = false
detect_extensions = []
detect_files = []
detect_folders = []
symbol = ""
style = "bg:#604015 fg:#d5dfef"
format = '[](bold fg:#604015)[$symbol ($virtualenv)]($style)[](bold fg:#604015)'
