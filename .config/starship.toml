# No newline at start
add_newline = false

format = """
$cmd_duration 󰜥 $directory $python $git_branch
$character"""

# --------------------------
# CHARACTER (PROMPT SYMBOL)
# --------------------------
[character]
success_symbol = "[   ](bold fg:#6589ff)"
error_symbol   = "[   ](bold fg:#5f6087)"

# --------------------------
# GIT BRANCH
# --------------------------
[git_branch]
symbol = "󰘬"
style = "bg:#5f6087 fg:#f3f4ff"
truncation_length = 12
format = "󰜥 [](bold fg:#5f6087)[$symbol $branch]($style)[ ](bold fg:#5f6087)"

# --------------------------
# DIRECTORY
# --------------------------
[directory]
home_symbol = "  "
read_only = "  "
style = "bg:#1e1c3e fg:#f3f4ff"
format = '[](bold fg:#1e1c3e)[󰉋 $path]($style)[](bold fg:#1e1c3e)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

# --------------------------
# CMD DURATION
# --------------------------
[cmd_duration]
min_time = 0
style = "bg:#6589ff fg:#f3f4ff"
format = '[](bold fg:#6589ff)[󰪢 $duration]($style)[](bold fg:#6589ff)'

# --------------------------
# HOSTNAME
# --------------------------
[hostname]
style = "bg:#312f5d fg:#f3f4ff"
format = "[](bold fg:#312f5d)[•$hostname]($style)[](bold fg:#312f5d)"
ssh_only = false
disabled = false

# --------------------------
# USERNAME
# --------------------------
[username]
style_user = "bold bg:#1a1839 fg:#f3f4ff"
format = "[](bold fg:#1a1839)[$user]($style)[](bold fg:#1a1839)"
show_always = true

# --------------------------
# PACKAGE
# --------------------------
[package]
disabled = true

# --------------------------
# PYTHON VENV
# --------------------------
[python]
disabled = false
detect_extensions = []
detect_files = []
detect_folders = []
symbol = ""
style = "bg:#2133ad fg:#dbdcf1"
format = '[](bold fg:#2133ad)[$symbol ($virtualenv)]($style)[](bold fg:#2133ad)'
