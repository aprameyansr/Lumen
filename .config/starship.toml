# No newline at start
add_newline = false

format = """
$cmd_duration 󰜥 $directory $python $git_branch
$character"""

# --------------------------
# CHARACTER (PROMPT SYMBOL)
# --------------------------
[character]
success_symbol = "[   ](bold fg:#e9c57f)"
error_symbol   = "[   ](bold fg:#5c6d7d)"

# --------------------------
# GIT BRANCH
# --------------------------
[git_branch]
symbol = "󰘬"
style = "bg:#5c6d7d fg:#eef6ff"
truncation_length = 12
format = "󰜥 [](bold fg:#5c6d7d)[$symbol $branch]($style)[ ](bold fg:#5c6d7d)"

# --------------------------
# DIRECTORY
# --------------------------
[directory]
home_symbol = "  "
read_only = "  "
style = "bg:#1a2836 fg:#eef6ff"
format = '[](bold fg:#1a2836)[󰉋 $path]($style)[](bold fg:#1a2836)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

# --------------------------
# CMD DURATION
# --------------------------
[cmd_duration]
min_time = 0
style = "bg:#e9c57f fg:#eef6ff"
format = '[](bold fg:#e9c57f)[󰪢 $duration]($style)[](bold fg:#e9c57f)'

# --------------------------
# HOSTNAME
# --------------------------
[hostname]
style = "bg:#2b3e50 fg:#eef6ff"
format = "[](bold fg:#2b3e50)[•$hostname]($style)[](bold fg:#2b3e50)"
ssh_only = false
disabled = false

# --------------------------
# USERNAME
# --------------------------
[username]
style_user = "bold bg:#152431 fg:#eef6ff"
format = "[](bold fg:#152431)[$user]($style)[](bold fg:#152431)"
show_always = true

# --------------------------
# PACKAGE
# --------------------------
[package]
disabled = true

# --------------------------
# PYTHON VENV
# --------------------------
[python]
disabled = false
detect_extensions = []
detect_files = []
detect_folders = []
symbol = ""
style = "bg:#5c4308 fg:#d4e0eb"
format = '[](bold fg:#5c4308)[$symbol ($virtualenv)]($style)[](bold fg:#5c4308)'
