# No newline at start
add_newline = false

format = """
$cmd_duration 󰜥 $directory $python $git_branch
$character"""

# --------------------------
# CHARACTER (PROMPT SYMBOL)
# --------------------------
[character]
success_symbol = "[   ](bold fg:#b66dde)"
error_symbol   = "[   ](bold fg:#516891)"

# --------------------------
# GIT BRANCH
# --------------------------
[git_branch]
symbol = "󰘬"
style = "bg:#516891 fg:#f0f5ff"
truncation_length = 12
format = "󰜥 [](bold fg:#516891)[$symbol $branch]($style)[ ](bold fg:#516891)"

# --------------------------
# DIRECTORY
# --------------------------
[directory]
home_symbol = "  "
read_only = "  "
style = "bg:#102346 fg:#f0f5ff"
format = '[](bold fg:#102346)[󰉋 $path]($style)[](bold fg:#102346)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

# --------------------------
# CMD DURATION
# --------------------------
[cmd_duration]
min_time = 0
style = "bg:#b66dde fg:#f0f5ff"
format = '[](bold fg:#b66dde)[󰪢 $duration]($style)[](bold fg:#b66dde)'

# --------------------------
# HOSTNAME
# --------------------------
[hostname]
style = "bg:#1e3867 fg:#f0f5ff"
format = "[](bold fg:#1e3867)[•$hostname]($style)[](bold fg:#1e3867)"
ssh_only = false
disabled = false

# --------------------------
# USERNAME
# --------------------------
[username]
style_user = "bold bg:#0c1f41 fg:#f0f5ff"
format = "[](bold fg:#0c1f41)[$user]($style)[](bold fg:#0c1f41)"
show_always = true

# --------------------------
# PACKAGE
# --------------------------
[package]
disabled = true

# --------------------------
# PYTHON VENV
# --------------------------
[python]
disabled = false
detect_extensions = []
detect_files = []
detect_folders = []
symbol = ""
style = "bg:#602a7c fg:#d4dff1"
format = '[](bold fg:#602a7c)[$symbol ($virtualenv)]($style)[](bold fg:#602a7c)'
