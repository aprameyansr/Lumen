# No newline at start
add_newline = false

format = """
$cmd_duration 󰜥 $directory $python $git_branch
$character"""

# --------------------------
# CHARACTER (PROMPT SYMBOL)
# --------------------------
[character]
success_symbol = "[   ](bold fg:#ed6a57)"
error_symbol   = "[   ](bold fg:#586d81)"

# --------------------------
# GIT BRANCH
# --------------------------
[git_branch]
symbol = "󰘬"
style = "bg:#586d81 fg:#eef6ff"
truncation_length = 12
format = "󰜥 [](bold fg:#586d81)[$symbol $branch]($style)[ ](bold fg:#586d81)"

# --------------------------
# DIRECTORY
# --------------------------
[directory]
home_symbol = "  "
read_only = "  "
style = "bg:#16283a fg:#eef6ff"
format = '[](bold fg:#16283a)[󰉋 $path]($style)[](bold fg:#16283a)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

# --------------------------
# CMD DURATION
# --------------------------
[cmd_duration]
min_time = 0
style = "bg:#ed6a57 fg:#eef6ff"
format = '[](bold fg:#ed6a57)[󰪢 $duration]($style)[](bold fg:#ed6a57)'

# --------------------------
# HOSTNAME
# --------------------------
[hostname]
style = "bg:#253e55 fg:#eef6ff"
format = "[](bold fg:#253e55)[•$hostname]($style)[](bold fg:#253e55)"
ssh_only = false
disabled = false

# --------------------------
# USERNAME
# --------------------------
[username]
style_user = "bold bg:#112435 fg:#eef6ff"
format = "[](bold fg:#112435)[$user]($style)[](bold fg:#112435)"
show_always = true

# --------------------------
# PACKAGE
# --------------------------
[package]
disabled = true

# --------------------------
# PYTHON VENV
# --------------------------
[python]
disabled = false
detect_extensions = []
detect_files = []
detect_folders = []
symbol = ""
style = "bg:#802015 fg:#d2e0ee"
format = '[](bold fg:#802015)[$symbol ($virtualenv)]($style)[](bold fg:#802015)'
