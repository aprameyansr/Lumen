// Zen autoconfig: make the tooltips of Zen's bottom sidebar buttons (spaces,
// Library, ...) stylable from userChrome.css.
// Firefox always uses its built-in default tooltip (unreachable by CSS) for
// elements with `tooltiptext`, so the text is moved to `data-glass-tooltip`
// and the element is pointed at a real <tooltip id="glass-tooltip">.
try {
  const obs = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);

  obs.addObserver(function (win) {
    try {
      const doc = win.document;
      if (doc.getElementById("glass-tooltip")) return;

      const tip = doc.createXULElement("tooltip");
      tip.id = "glass-tooltip";
      tip.addEventListener("popupshowing", (event) => {
        const text = tip.triggerNode
          ?.closest?.("[data-glass-tooltip]")
          ?.getAttribute("data-glass-tooltip");
        if (!text) {
          event.preventDefault();
          return;
        }
        tip.setAttribute("label", text);
      });
      (doc.getElementById("mainPopupSet") || doc.documentElement).appendChild(tip);

      const root = doc.getElementById("navigator-toolbox") || doc.documentElement;
      const move = () => {
        for (const el of root.querySelectorAll("#zen-sidebar-foot-buttons [tooltiptext]")) {
          const own = el.getAttribute("tooltip");
          if (own && own !== "glass-tooltip") continue;
          const text = el.getAttribute("tooltiptext");
          el.setAttribute("data-glass-tooltip", text);
          if (!el.hasAttribute("aria-label")) el.setAttribute("aria-label", text);
          el.removeAttribute("tooltiptext");
          el.setAttribute("tooltip", "glass-tooltip");
        }
      };
      move();
      new win.MutationObserver(move).observe(root, {
        subtree: true,
        childList: true,
        attributes: true,
        attributeFilter: ["tooltiptext"],
      });
    } catch (e) {
      globalThis.console?.error?.("glass-tooltip:", e);
    }
  }, "browser-delayed-startup-finished");
} catch (e) {
  globalThis.console?.error?.("glass-tooltip:", e);
}
